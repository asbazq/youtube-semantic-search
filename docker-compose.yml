services:
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-youtube-semantic-search}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD를 .env 파일에 설정하세요}
      YTDLP_COOKIES_FROM_BROWSER: ${YTDLP_COOKIES_FROM_BROWSER:-}
      HF_HOME: /root/.cache/huggingface
      ERROR_LOG_FILE: /app/data/logs/error.log
      # backend 컨테이너의 localhost는 Ollama가 아니므로 서비스 이름을 사용한다.
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      CHAT_MIN_SCORE: ${CHAT_MIN_SCORE:-0.45}
    volumes:
      - ./data:/app/data
      - huggingface-cache:/root/.cache/huggingface
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-18765}:80"

  ollama:
    # 모델 추론은 이 컨테이너에서 실행한다. 모델 파일은 아래 볼륨에 유지된다.
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"

volumes:
  huggingface-cache:
  ollama-models:
